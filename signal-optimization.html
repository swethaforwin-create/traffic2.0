<!DOCTYPE html>
<html>
<head>

<title>Signal Optimization</title>

<style>

body {
    font-family: Arial;
    background: #0b1736;
    color: white;
    text-align: center;
    padding: 40px;
}

h1 {
    color: #35d07f;
}

.box {
    background: #172952;
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 15px;
}

input {
    padding: 12px;
    width: 80%;
    border: none;
    border-radius: 8px;
}

button {
    padding: 14px 25px;
    margin: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.run {
    background: #35d07f;
}

.back {
    background: #4da3ff;
    color: white;
}

#result {
    margin-top: 20px;
    line-height: 1.8;
}

</style>

</head>

<body>

<h1>🚦 Signal Optimization</h1>

<p>AI dynamically adjusts green signal time</p>

<div class="box">

    <input
        id="vehicles"
        type="number"
        placeholder="Enter Number of Vehicles">

    <br>

    <button class="run" onclick="optimizeSignal()">
        🤖 Optimize Signal
    </button>

    <div id="result">
        Waiting for AI decision...
    </div>

</div>

<button class="back"
onclick="location.href='suggestions.html'">
← Back to Suggestions
</button>

<script>

function optimizeSignal() {

    let vehicles =
        Number(document.getElementById("vehicles").value);

    let greenTime;

    if (vehicles >= 50) {
        greenTime = 60;
    }
    else if (vehicles >= 30) {
        greenTime = 45;
    }
    else {
        greenTime = 30;
    }

    document.getElementById("result").innerHTML =

        "🚗 Vehicles: " + vehicles +

        "<br>🚦 Traffic Level: " +
        (vehicles >= 50 ? "High" :
         vehicles >= 30 ? "Medium" : "Low") +

        "<br>🟢 Recommended Green Time: " +
        greenTime + " seconds" +

        "<br><br>✅ AI Signal Decision Completed.";
}

</script>

<script src="sound.js"></script>
<script src="language.js"></script>

<div id="google_translate_element" style="display:none;"></div>

<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,ta,hi,mr,te,ml,kn',
        autoDisplay: false
    }, 'google_translate_element');
}
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
