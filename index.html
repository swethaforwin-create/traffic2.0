<!DOCTYPE html>
<html>

<head>

    <title>Dynamic Traffic AI</title>

    <style>

        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 60px;
        }

        h1 {
            font-size: 40px;
            color: #35d07f;
        }

        p {
            font-size: 18px;
        }

        .menu {
            margin-top: 40px;
        }

        button {
            display: block;
            width: 300px;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .start {
            background: #35d07f;
        }

        .suggest {
            background: #4da3ff;
            color: white;
        }

        .exit {
            background: #ff6262;
            color: white;
        }

    </style>

</head>

<body>

    <h1>🚦 Dynamic Traffic AI</h1>

    <p>Autonomous Agentic AI Traffic Management</p>

    <div class="menu">

        <button class="start"
            onclick="location.href='traffic.html'">
            🚗 Start Simulation
        </button>

        <button class="suggest"
            onclick="location.href='suggestions.html'">
            💡 Suggestions
        </button>

        <button class="exit"
            onclick="location.href='exit.html'">
            🚪 Exit
        </button>

    </div>

    <!-- Sound -->
    <script src="sound.js"></script>

    <!-- Language -->
    <script src="language.js"></script>

<div id="google_translate_element"
     style="display:none;">
</div>

<script>

function googleTranslateElementInit() {

    new google.translate.TranslateElement({

        pageLanguage: 'en',

        includedLanguages:
        'en,ta,hi,mr,te,ml,kn',

        autoDisplay: false

    }, 'google_translate_element');

}

</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>
</body>

</html>
